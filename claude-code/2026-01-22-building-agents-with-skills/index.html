<body data-layout="reading">
<header class="top"><div class="top-inner"><div id="brand" class="brand">英语阅读练习</div><a id="catalog-link" class="paper-link" href="../../index.html">练习目录</a></div></header>
<main class="wrap">
<div class="intro">
 <div><h1 id="lesson-label">阅读与练习</h1><p id="lesson-info"></p></div>
 <div class="switches">
  <div class="switch-group"><span class="control-label">版式</span><div class="modes" role="group" aria-label="页面版式"><button id="reading-layout" aria-pressed="true">阅读版</button><button id="exam-layout" aria-pressed="false">考卷版</button></div></div>
  <div class="switch-group"><span class="control-label">阶段</span><div class="modes" role="group" aria-label="练习模式"><button id="answer-mode" aria-pressed="true">答题</button><button id="review-mode" aria-pressed="false">解答</button></div></div>
 </div>
</div>
<section id="exercise-tools" aria-label="答题工具" hidden>
 <div class="practice-head"><div class="stats"><span id="progress-label"></span><div class="clock"><span id="timer">00:00</span> <button id="timer-toggle" class="small">开始计时</button></div></div><div id="progress" class="bar" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span id="progress-fill" style="width:0%"></span></div><div class="nav-row"><nav id="question-nav" class="question-nav" aria-label="题号导航"></nav><button id="flag-current" class="flag" aria-pressed="false">标记当前题</button></div><p id="nav-legend" class="legend"></p></div>
 <div id="result" class="result" hidden aria-live="polite"></div>
 <div id="review-controls" class="review-controls" hidden><label class="row"><input id="wrong-only" type="checkbox">只看错题与未答题</label><span id="filter-count" class="muted"></span></div>
 <div id="submit-alert" class="alert" hidden role="alert"><p id="submit-alert-text"></p><div class="row"><button id="go-unanswered">去补答</button><button id="submit-anyway" class="primary">仍然交卷</button></div></div>
</section>
<div class="layout">
 <header class="paper-header" lang="en"><h2>PART 7</h2><p class="directions"><strong>Directions:</strong> Read the passage and answer the questions below. Select one answer per question. Choose (A), (B), (C), or (D).</p></header>
 <section id="article" class="panel source-panel" aria-labelledby="article-title">
  <p id="passage-ref" class="passage-ref" lang="en"></p>
  <div class="panel-body"><p id="reading-kicker" class="reading-kicker"></p><h2 id="article-title" class="source-title" lang="en"></h2><p id="article-subtitle" class="article-lede" lang="en"></p><div id="article-meta" class="meta"></div><div id="reader" class="reading" lang="en" aria-label="完整英文原文"></div></div>
 </section>
 <div id="reading-finish" class="reading-finish"><span>先读一遍，再检查自己的理解。</span><button id="open-questions">读完了，开始答题 →</button></div>
 <section id="questions-section" class="panel questions-section" aria-label="阅读理解题目" hidden><h2 id="questions-title" class="questions-title">阅读练习</h2><div id="question-container"></div><div id="empty-filter" class="empty-filter" hidden><strong>全部答对了。</strong><p>可以关闭筛选，回看每题的解题依据。</p><button id="show-all">查看全部题目</button></div></section>
</div>
<div id="actions" class="actions" hidden><button id="close-questions">收起题目，回到阅读</button><button id="submit" class="primary">交卷并查看解析</button><button id="back-answer" hidden>返回答题</button></div>
<div id="source-note" class="source-footer"></div>
<div class="article-tools"><a id="official-source" class="paper-link" href="#" target="_blank" rel="noopener noreferrer">官网原文 ↗</a><button id="download-paper" class="text-button">导出单一 HTML</button><button id="print-paper" class="text-button">打印当前版式</button></div>
<div class="status-line"><span id="save-status">进度自动保存在当前浏览器。</span><div class="row"><a href="https://www.ets.org/content/dam/ets-org/pdfs/toeic/toeic-listening-reading-sample-test.pdf" target="_blank" rel="noopener noreferrer">ETS 官方样题 ↗</a><button id="restart" class="text-button">重新练习</button></div></div><div id="live" class="sr-only" aria-live="polite"></div>

<script id="lesson-data" type="application/json">{"schemaVersion": 1, "id": "claude-reading-2026-01-22", "storageKey": "claude-reading-2026-01-22-v1", "collection": "Claude Code", "ordinal": 2, "article": {"title": "Building agents with Skills: Equipping agents for specialized work", "subtitle": "Skills package domain expertise in files agents can access and apply—turning general-purpose agents into knowledgeable specialists for real work.", "author": "Anthropic", "date": "2026-01-22", "url": "https://claude.com/resources/articles/building-agents-with-skills-equipping-agents-for-specialized-work", "body": "A lot has changed in the past year. MCP became the standard for agent connectivity with rapid adoption from industry leaders and the developer community. Claude Code launched as a general-purpose coding agent. And we launched the Claude Agent SDK, which now provides a production-ready agent out of the box.\n\nBut as we've built and deployed these agents, we keep running into the same gap: agents have intelligence and capabilities, but not always the expertise to effectively tackle real work. This led us to create Agent Skills. Skills are organized collections of files that package domain expertise - workflows, best practices, scripts - in a format agents can access and apply. They turn a capable generalist into a knowledgeable specialist.\n\nIn this post, we'll explain why we stopped building specialized agents and started building skills instead, and how this shift is changing how we think about extending agent capabilities.\n\n### The new paradigm: code is all you need\n\nWe used to think agents in different domains would look very different. A coding agent, a research agent, one for finance, one for marketing—each seemed to need its own tools and scaffolding. The industry initially embraced this model of domain-specific agents. But as models improved in intelligence and agent capabilities progressed, we converged on a different approach.\n\nWe came to see code less as just a use case and more as an interface for agents to do almost any digital work. Claude Code is a coding agent, but also a general-purpose agent that happens to work through code.\n\nConsider working with Claude Code to generate a financial report. It can call APIs for research, store data in the filesystem, analyze it with Python, and synthesize insights. All of that happens through code. The scaffolding becomes as simple as bash and a filesystem.\n\nBut general capability isn't the same as expertise. When we started using Claude Code for real work, a gap emerged.\n\n### The missing piece: domain expertise\n\nWho would you want filing your taxes: a math genius figuring it out from first principles, or an experienced tax professional who's filed thousands of returns? Most people would choose the tax professional. Not because they're smarter, but because they have the right expertise.\n\nAgents today are like that math genius: brilliant at reasoning through novel situations, but often lacking the accumulated expertise of a seasoned professional. They can do amazing things with proper guidance. However, they're often missing important context, can't easily absorb your organization's expertise, and don't automatically learn from repeated tasks.\n\nSkills bridge this gap by packaging domain expertise in a format that agents can progressively access and apply.\n\n### What are Agent Skills?\n\nSkills package domain expertise and procedural knowledge for agents.\n\n```text\nanthropic_brand/\n├── SKILL.md\n├── docs.md\n├── slide-decks.md\n└── apply_template.py\n```\n\nThe simplicity of skills is deliberate. Files are a universal primitive that works with what you already have. You can version them with Git, store them in Google Drive, and share them with your team. This simplicity also means skill creation isn't limited to engineers. Product managers, analysts, and domain experts are already building skills to codify their workflows.\n\n### Progressive disclosure\n\nSkills can contain extensive information. To protect the context window and make skills composable, they use progressive disclosure: at runtime, only the metadata (name and description from the YAML frontmatter) is shown to the model.\n\n```yaml\n---\nname: Anthropic Brand Style Guidelines\ndescription: Anthropic's official brand colors and typography…\n---\n```\n\nIf Claude determines a skill is needed, it reads the full SKILL.md file. For additional detail, skills can include a references/ directory with supporting documentation loaded only on demand.\n\nThis three-tier approach means you can equip an agent with hundreds of skills without overwhelming its context window—metadata uses ~50 tokens, full SKILL.md files ~500 tokens, and reference files 2,000+ tokens and only when specifically needed.\n\n### Skills can include scripts as tools\n\nTraditional tools have problems: some have poorly written instructions, the model can't always modify or extend them, and they often bloat the context window. Code, on the other hand, is self-documenting, modifiable, and doesn't need to be in context at all times.\n\nHere's a real example: we kept seeing Claude write the same script to apply Anthropic styling to slides. So we asked Claude to save it as a tool for itself:\n\n```python\n# anthropic/brand_styling/apply_template.py\nimport sys\nfrom pptx import Presentation\n\nif len(sys.argv) != 2:\n    print(\"USAGE: apply_template.py \u003cpptx\u003e\")\n    sys.exit(1)\n\nprs = Presentation(sys.argv[1])\nfor slide in prs.slides:\n    ...\n```\n\nThe corresponding documentation in slide-decks.md simply references this script:\n\n```markdown\n## Anthropic Slide Decks\n- Intro/outro slides\n  - background color: `#141413`\n  - foreground color: oat\n- Section slides:\n  - background color: `#da7857`\n  - foreground color: `#141413`\n\nUse the `./apply_template.py` script to update a pptx file in-place.\n```\n\n### The skills ecosystem\n\nThe skills ecosystem has emerged quickly, and so far we've seen three major types of skills being built:\n\n#### Foundational skills\n\nThese provide core capabilities everyone needs: working with documents, spreadsheets, presentations, etc. They encode best practices for document generation and manipulation. You can see what this looks like in practice by exploring the foundational skills in our public repository.\n\n#### Partner skills\n\nAs skills standardize how agents interact with specialized capabilities, companies are building skills to make their services agent-accessible. K-Dense, Browserbase, Notion, and many others are creating skills that integrate their services directly, extending Claude's capabilities in specific domains while maintaining the simplicity of the skills format.\n\n#### Enterprise skills\n\nOrganizations build proprietary skills encoding their internal processes and domain expertise. Skills help capture the specific workflows, compliance requirements, and institutional knowledge that make an agent useful for enterprise work.\n\n### Trends we see\n\nAs skills adoption grows, several patterns are emerging that point to where this paradigm may be heading. These trends shape how we think about skill design and the tooling we're building to support skill developers.\n\n#### Increasing complexity\n\nEarly skills were simple documentation references. Now we're seeing sophisticated multi-step workflows that coordinate data retrieval, complex calculations, and formatted output across multiple tools.\n\n- Simple: \"Status report writer\" (~100 lines) - Templates and formatting\n- Intermediate: \"Financial model builder\" (~800 lines) - Data retrieval, Excel modeling with Python\n- Complex: \"RNA sequencing pipeline\" (2,500+ lines) - Coordinates HISAT2, StringTie, DESeq2 analysis\n\n#### Skills and MCP\n\nSkills and MCP servers work together naturally. A competitive analysis skill might coordinate web search, internal databases via MCP, Slack message history, and Notion pages to synthesize a comprehensive report.\n\n#### Non-developer adoption\n\nSkill creation is expanding beyond engineers to product managers, analysts, and domain experts across disciplines. They can create and test their first skill in under 30 minutes using the skill-creator tool, which guides them through the process interactively. We're working to make skill creation even more accessible, with improved tooling and templates that let anyone capture and share expertise.\n\n### The complete architecture\n\nPutting it all together, the emerging agent architecture looks like a combination of:\n\n1. Agent loop: The core reasoning system that decides what to do next\n2. Agent runtime: Execution environment (code, filesystem)\n3. MCP servers: Connections to external tools and data sources\n4. Skills library: Domain expertise and procedural knowledge\n\nEach layer has a clear purpose: the loop reasons, the runtime executes, MCP connects, and skills guide. This separation makes the system comprehensible and allows each piece to evolve independently.\n\nConsider what happens when you add a single skill to this architecture. The frontend design skill transforms Claude's frontend capabilities instantly. It provides specialized guidance on typography, color theory, and animation, activating only when building web interfaces. Progressive disclosure means it loads only when relevant. Adding new capabilities is straightforward.\n\n### Deploying skills to new verticals\n\nThis emerging pattern of general agents equipped with MCP servers and skills is already helping us deploy Claude to new verticals.\n\n#### Financial Services\n\nJust after launching skills, we enhanced Claude for the financial services sector with skills that make Claude more useful for finance professionals:\n\n- DCF model builder: Constructs discounted cash flow models with proper WACC calculations and sensitivity analysis\n- Comparable company analysis: Generates comps tables with relevant multiples and benchmarking\n- Earnings analysis: Processes quarterly results and creates investment update reports\n- Initiation coverage: Builds comprehensive research reports with financial models\n- Due diligence: Structures M\u0026A analysis with standardized frameworks\n- Pitch materials: Creates client presentations following industry standards\n\n#### Healthcare \u0026 Life Sciences\n\nWe've also enhanced our healthcare and life sciences offerings with skills that make Claude more useful for researchers, clinicians, and healthcare developers:\n\n- Bioinformatics bundles: Skills for scVI-tools and Nextflow deployments, essential for managing genomic pipelines and single-cell RNA sequencing\n- Clinical trial protocol generation: Accelerates protocol development for clinical research\n- Scientific problem selection: Helps researchers identify and frame impactful research questions\n- FHIR development: Helps developers write more accurate code for health data interoperability, connecting healthcare systems faster with fewer errors\n- Prior authorization review: Cuts administrative burden and accelerates patient access to needed care by cross-referencing coverage requirements, clinical guidelines, and patient records\n\n### Standardizing Agent Skills\n\nTo enable this vision, we're publishing Agent Skills as an open standard. Like MCP, we believe skills should be portable across tools and platforms. The same skill should work whether you're using Claude or other AI platforms. We've been collaborating with members of the ecosystem on the standard, and we're excited to see early adoption.\n\nWhen someone starts using an AI agent for the first time, it should already know what you and your team care about because skills capture and transfer that expertise. As this ecosystem grows, a skill built by someone else in the community can make your agent more useful, reliable, and capable - regardless of which AI platform they're using.\n\n### Getting started\n\nWe're converging on an architecture for general agents, and skills provide a paradigm for shipping and sharing new capabilities. The real value emerges from the collective knowledge base we build together: capturing expertise, transferring it across teams, and making every agent more capable than the last.\n\nResources:\n\n- Don’t Build Agents, Build Skills Instead (YouTube Video)\n- Skills documentation\n- GitHub repository\n- Skills cookbook\n- Using skills in Claude\n- Skills API quickstart\n- Skills best practices documentation\n\nAcknowledgments:\n\nBarry Zhang, Mahesh Murag, Keith Lazuka, Ryan Whitehead", "sourceLabel": "Official blog"}, "exercise": {"startNumber": 147, "suggestedMinutes": 35, "note": "自编 TOEIC Part 7 风格长文拓展练习；24 题与 35 分钟为学习设置。"}, "questions": [{"type": "主旨 / Purpose", "stem": "What is the main purpose of the article?", "options": ["To compare the subscription costs of several specialized agents", "To announce that general-purpose agents no longer need external tools", "To explain how reusable skills give general-purpose agents specialized expertise", "To provide a complete programming course for first-time developers"], "answer": 2, "where": "开头第三段，以及 Getting started 小节", "needle": "In this post, we'll explain", "explain": "C 概括了全文的核心：通过可复用的 Skills，为通用 agent 补充领域经验。文章依次说明原因、文件结构、按需加载、生态和行业应用。", "traps": ["A：没有订阅价格比较。", "B：文章仍把 MCP 和运行环境列为架构组成部分。", "D：代码示例用于解释 Skills，全文并非编程课程。"], "tip": "主旨题用开头的写作目的核对结尾，选择能覆盖全文的概括。"}, {"type": "细节 / Detail", "stem": "According to the opening section, what problem led to the creation of Agent Skills?", "options": ["Agents could reason and act but often lacked relevant professional expertise.", "Agents had professional expertise but could no longer execute code.", "Organizations were unable to store documents in ordinary files.", "Developers needed a separate subscription for every workflow."], "answer": 0, "where": "开头第二段，描述 agents 的能力与经验缺口", "needle": "agents have intelligence and capabilities", "explain": "A 对应 intelligence and capabilities 与 not always put from executing all skills in advance"], "answer": 1, "where": "Progressive disclosure 小节，第一段", "needle": "only the metadata", "explain": "B 对应 metadata 后括号里的 name and description。完整 SKILL.md 和参考文件按需要进一步读取。", "traps": ["A：参考文档属于后续按需加载的信息。", "C：初始展示的并非所有脚本源代码。", "D：文中没有提前执行全部 Skills 的步骤。"], "tip": "步骤题分清 initially、if needed 和 additional detail 所表示的先后条件。"}, {"type": "细节 / Detail", "stem": "When does Claude read supporting documentation in a references/ directory?", "options": ["Whenever the agent starts, regardless of the task", "Only after the skill has been removed from the library", "When additional information is needed for the relevant skill", "Only when all other available skills have already been executed"], "answer": 2, "where": "Progressive disclosure 小节，If Claude determines 开头的段落", "needle": "supporting documentation loaded only on demand", "explain": "C 对应 additional detail 和 loaded only on demand。加载条件是当前任务需要更详细的信息。", "traps": ["A：忽略了 only on demand。", "B：没有移除 Skill 后才加载的规则。", "D：没有先执行其他所有 Skills 的要求。"], "tip": "only 限定的是加载条件，注意它的作用范围。"}, {"type": "数据理解 / Detail", "stem": "What do the token estimates in the progressive disclosure section illustrate?", "options": ["Detailed content can be deferred to help conserve the context window.", "Every skill must have exactly the same number of tokens.", "Reference files are always smaller than skill metadata.", "An agent can use no more than three skills during one task."], "answer": 0, "where": "Progressive disclosure 小节，This three-tier approach 开头的段落", "needle": "This three-tier approach", "explain": "A 抓住数字的作用：少量 metadata 先进入上下文，较长的文件按需加载。~50、~500 和 2,000+ 是说明不同层级体量的估计，不是统一的精确限制。", "traps": ["B：把估计数误读成每个 Skill 的固定要求。", "C：文中列出的参考文件体量更大。", "D：three-tier 指信息层级，不能解释为最多三个 Skills。"], "tip": "数字题除了读数值，也要判断数字在论证什么；~ 表示约数。"}, {"type": "原因 / Reason", "stem": "Why did the team ask Claude to save its slide-styling script as a tool?", "options": ["The script was required to connect to a new billing service.", "Claude had r -step workflows", "explain": "D 概括了从简单文档参考到多步复杂流程的变化。三个例子呈现不同复杂程度，不构成所有 Skills 的统一要求。", "traps": ["A：趋势方向与原文相反。", "B：不同案例使用不同工具，不能推出统一软件要求。", "C：状态报告示例仍保留模板与格式能力。"], "tip": "并列示例题要概括整组例子共同说明的趋势。"}, {"type": "关系理解 / Relationship", "stem": "What does the competitive-analysis example suggest about the relationship between skills and MCP?", "options": ["A skill can be used only after every MCP server has been disconnected.", "MCP servers replace the procedural guidance supplied by skills.", "A skill can coordinate a workflow that uses data accessed through MCP.", "MCP limits an agent to information stored in a single local file."], "answer": 2, "where": "Trends we see → Skills and MCP", "needle": "A competitive analysis skill might coordinate", "explain": "C 保留了二者的配合关系：Skill 协调分析流程，MCP 帮助访问内部数据库等信息来源。", "traps": ["A：原文说二者可以自然配合。", "B：数据连接与流程知识的角色不同，文中没有替代关系。", "D：案例包含网络搜索、数据库及多个协作平台。"], "tip": "关系题区分“连接数据”和“指导流程”这两种角色。"}, {"type": "限定理解 / Detail", "stem": "Which statement about non-developer adoption is supported by the article?", "options": ["Every advanced skill can be completed in less than 30 minutes.", "People outside engineering can create and test an initial skill with interactive guidance.", "Domain experts must first build a separate agent runtime.", "Skill creation is being restricted to product managers."], "answer": 1, "where": "Trends we see → Non-developer adoption", "needle": "They can create and test their first skill in under 30 minutes", "explain": "B 对应产品经理、分析师、领域专家等人群在 skill-creator 的交互引导下创建并测试 first skill。原文的时间描述针对初次 Skill 示例，不能扩展到所有高级流程。", "traps": ["A：把 first skill 扩大为 every advanced skill。", "C：没有要求先搭建独立运行环境。", "D：原文强调参与人群扩大，没有限定为某一职业。"], "tip": "检查 first、every、only 等限定词，防止选项偷换范围。"}, {"type": "信息匹配 / Matching details", "stem": "Which part of the architecture is responsible for deciding what the agent should do next?", "options": ["The agent runtime", "The MCP servers", "The skills library", "The agent loop"], "answer": 3, "where": "The complete architecture 小节，四层架构列表第一项", "needle": "Agent loop: The core reasoning system", "explain": "D 对应 the core reasoning system that decides what to do next。决策职责属于 agent loop。", "traps": ["A：runtime 是执行环境。", "B：MCP servers 连接外部工具与数据。", "C：skills library 提供领域经验与流程知识。"], "tip": "列表匹配题把组件名与动词绑定：decides、executes、connects、guides。"}, {"type": "信息匹配 / Matching details", "stem": "In the proposed architecture, where is domain expertise and procedural knowledge provided?", "options": ["In the skills library", "In the agent runtime", "In the external connection layer alone", "In the core reasoning loop alone"], "answer": 0, "where": "The complete architecture 小节，四层架构列表第四项", "needle": "Skills library: Domain expertise and procedural knowledge", "explain": "A 对应列表中的 skills library。后面的概括 skills guide 进一步说明它承担指导任务流程的角色。", "traps": ["B：运行环境负责执行代码和文件操作。", "C：外部连接层的职责是连接工具与数据，不能替代领域知识层。", "D：核心推理循环负责决定下一步动作，原文单独列出了知识库层。"], "tip": "同一列表可能有多个易混项，按原文分工逐项排除。"}, {"type": "细节 / Detail", "stem": "Which financial-services capability is specifically described in the article?", "options": ["Approving all acquisitions without further analysis", "Guaranteeing the future returns of investment portfolios", "Turning quarterly results into investment update reports", "Replacing financial models with clinical research protocols"], "answer": 2, "where": "Deploying skills to new verticals → Financial Services，Earnings analysis 项", "needle": "Earnings analysis: Processes quarterly results", "explain": "C 是 Processes quarterly results and creates investment update reports 的同义转述。", "traps": ["A：尽职调查是用标准框架分析，并非自动批准所有收购。", "B：文章没有承诺投资回报。", "D：临床研究方案属于另一个行业的小节。"], "tip": "跨行业细节题先定位小节，再匹配输入材料和输出成果。"}, {"type": "细节 / Detail", "stem": "How is prior authorization review described as reducing administrative work?", "options": ["By creating presentation slides for investment clients", "By cross-checking coverage requirements, guidelines, and patient records", "By eliminating the need to consult coverage requirements", "By replacing health-data interoperability code with financial models"], "answer": 1, "where": "Deploying skills to new verticals → Healthcare \u0026 Life Sciences，最后一项", "needle": "Prior authorization review: Cuts administrative burden", "explain": "B 对应 by cross-referencing 后面的三个信息来源：coverage requirements、clinical guidelines、patient records。题目考的是文章如何描述这项能力。", "traps": ["A：客户演示材料属于 Financial Services。", "C：原文要求交叉核对保障要求，不能解释成无需查看。", "D：混合了医疗互操作开发和财务模型两种不同应用。"], "tip": "how 题常可定位 by 后面的方式说明。"}, {"type": "语境词义 / Vocabulary", "stem": "In the standardization section, the word “portable” is closest in meaning to", "options": ["usable across different systems", "small enough to fit on a phone", "kept private within one organization", "available only through a paid subscription"], "answer": 0, "where": "Standardizing Agent Skills 小节，第一段", "needle": "skills should be portable across tools and platforms", "explain": "A 符合 across tools and platforms 的语境。下一句说明同一个 Skill 应能用于 Claude 或其他 AI 平台，进一步限定了 portable 的含义。", "traps": ["B：把软件兼容性理解成物理尺寸。", "C：与跨平台共享的方向不符。", "D：原文没有把该词用于描述收费方式。"], "tip": "抽象技术词也可用上下句释义；优先寻找作者自己的解释。"}, {"type": "综合推断 / Inference", "stem": "Which action would best support the article’s concluding vision?", "options": ["Keeping useful workflows undocumented so each team must rediscover them", "Designing every skill so it works with only one isolated platform", "Removing domain experts from the process of improving agent workflows", "Recording tested workflows in reusable skills that other teams can adapt"], "answer": 3, "where": "Getting started 结尾，以及前一节关于经验传递的段落", "needle": "capturing expertise, transferring it across teams", "explain": "D 把结尾的 capturing expertise 与 transferring it across teams 转换成具体行动：记录、复用并分享经验。", "traps": ["A：不记录流程会阻碍共同知识积累。", "B：单一隔离平台的设计不符合可移植方向。", "C：领域专家是捕获经验的重要参与者。"], "tip": "综合推断把结尾抽象目标改写成可执行的行动，再逐项核对范围。"}]}</script>
<script id="export-defaults" type="application/json">{"layout":"reading"}</script>
<script>'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const lesson = JSON.parse($('lesson-data').textContent);
  const defaults = JSON.parse($('export-defaults').textContent);
  const questions = lesson.questions;
  const total = questions.length;
  const start = lesson.exercise.startNumber;
  const key = lesson.storageKey;
  const letters = 'ABCD';
  const fresh = () => ({answers: Array(total).fill(null), flags: Array(total).fill(false), current: 0,
    mode: 'answer', layout: defaults.layout === 'exam' ? 'exam' : 'reading', questionsOpen: false,
    elapsed: 0, wrongOnly: false, submitted: false});
  let state = fresh(), storageOK = true, running = false, startedAt = 0;
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    if (saved && typeof saved === 'object') {
      const upgraded = saved.layout === 'exam' || saved.layout === 'reading';
      state = {...fresh(),
        answers: Array.from({length: total}, (_, i) => Number.isInteger(saved.answers?.[i]) && saved.answers[i] >= 0 && saved.answers[i] < 4 ? saved.answers[i] : null),
        flags: Array.from({length: total}, (_, i) => saved.flags?.[i] === true),
        current: Number.isInteger(saved.current) && saved.current >= 0 && saved.current < total ? saved.current : 0,
        mode: upgraded && saved.mode === 'review' ? 'review' : 'answer',
        layout: upgraded ? saved.layout : fresh().layout,
        questionsOpen: upgraded && saved.questionsOpen === true,
        elapsed: Number.isFinite(saved.elapsed) && saved.elapsed >= 0 ? saved.elapsed : 0,
        wrongOnly: upgraded && saved.wrongOnly === true, submitted: saved.submitted === true};
    }
  } catch { storageOK = false; }

  function el(tag, attributes = {}, text = '') {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (name === 'class') node.className = value;
      else node.setAttribute(name, value);
    }
    node.textContent = text;
    return node;
  }
  function safeURL(value) {
    try { const url = new URL(value); return ['https:', 'http:'].includes(url.protocol) ? url.href : '#'; }
    catch { return '#'; }
  }
  function save() {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch { storageOK = false; }
    $('save-status').textContent = storageOK ? '版式与答题进度自动保存在当前浏览器。' : '浏览器未允许本地保存；可正常使用，关闭页面后进度可能丢失。';
  }
  function announce(text) { $('live').textContent = text; }
  const answerCount = () => state.answers.filter(x => x !== null).length;
  const correctCount = () => questions.filter((q, i) => state.answers[i] === q.answer).length;
  const visibleIds = () => questions.map((_, i) => i).filter(i => state.mode !== 'review' || !state.wrongOnly || state.answers[i] !== questions[i].answer);
  const questionsVisible = () => state.layout === 'exam' || state.questionsOpen || state.mode === 'review';

  function syncTime() {
    if (running) { const now = Date.now(); state.elapsed += Math.max(0, now - startedAt); startedAt = now; }
  }
  function renderTime() {
    const seconds = Math.floor((state.elapsed + (running ? Math.max(0, Date.now() - startedAt) : 0)) / 1000);
    $('timer').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
    $('timer-toggle').textContent = running ? '暂停' : state.elapsed ? '继续计时' : '开始计时';
    $('timer-toggle').disabled = state.mode === 'review';
  }
  function stopTimer() { syncTime(); running = false; renderTime(); save(); }
  function startTimer() { if (state.mode === 'review' || running) return; running = true; startedAt = Date.now(); renderTime(); }

  function appendInline(parent, text) {
    const pattern = /(`[^`\n]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g;
    let offset = 0;
    for (const match of text.matchAll(pattern)) {
      parent.append(document.createTextNode(text.slice(offset, match.index)));
      if (match[0].startsWith('`')) parent.append(el('code', {}, match[0].slice(1, -1)));
      else if (match[0].startsWith('**')) parent.append(el('strong', {}, match[0].slice(2, -2)));
      else {
        const link = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(match[0]);
        parent.append(el('a', {href: safeURL(link[2]), target: '_blank', rel: 'noopener noreferrer'}, link[1]));
      }
      offset = match.index + match[0].length;
    }
    parent.append(document.createTextNode(text.slice(offset)));
  }
  function appendArticleBlocks(reader, text) {
    const lines = text.replace(/\r\n?/g, '\n').trim().split('\n');
    const listItem = line => /^\s*(?:[-*]|\d+\.)\s+/.test(line);
    for (let i = 0; i < lines.length;) {
      if (!lines[i].trim()) { i++; continue; }
      if (/^```/.test(lines[i])) {
        const code = []; i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) code.push(lines[i++]);
        if (i < lines.length) i++;
        const pre = el('pre', {tabindex: '0', 'aria-label': '文章代码示例'});
        pre.append(el('code', {}, code.join('\n'))); reader.append(pre); continue;
      }
      if (/^#{2,3}\s+/.test(lines[i])) {
        const heading = el('h3'); appendInline(heading, lines[i++].replace(/^#{2,3}\s+/, ''));
        reader.append(heading); continue;
      }
      if (/^####\s+/.test(lines[i])) {
        const heading = el('h4'); appendInline(heading, lines[i++].replace(/^####\s+/, ''));
        reader.append(heading); continue;
      }
      if (listItem(lines[i])) {
        const ordered = /^\s*\d+\./.test(lines[i]);
        const list = el(ordered ? 'ol' : 'ul');
        if (ordered) list.start = Number(lines[i].trim().match(/^\d+/)[0]);
        while (i < lines.length && listItem(lines[i]) && /^\s*\d+\./.test(lines[i]) === ordered) {
          const item = el('li'); appendInline(item, lines[i++].replace(/^\s*(?:[-*]|\d+\.)\s+/, ''));
          list.append(item);
        }
        reader.append(list); continue;
      }
      const paragraph = [];
      while (i < lines.length && lines[i].trim() && !/^```|^#{2,4}\s+/.test(lines[i]) && !listItem(lines[i])) paragraph.push(lines[i++]);
      const node = el('p'); appendInline(node, paragraph.join('\n')); reader.append(node);
    }
  }
  function renderArticle() {
    document.title = lesson.article.title + ' · 阅读练习';
    $('brand').textContent = '英语阅读练习 · ' + lesson.collection;
    $('lesson-label').textContent = '第 ' + String(lesson.ordinal || 1).padStart(2, '0') + ' 篇 · 阅读与练习';
    $('lesson-info').textContent = `${total} 道拓展题 · 练习目标 ${lesson.exercise.suggestedMinutes} 分钟`;
    $('article-title').textContent = lesson.article.title;
    $('article-subtitle').textContent = lesson.article.subtitle;
    $('article-meta').textContent = lesson.article.author + ' · ' + lesson.article.date;
    $('reading-kicker').textContent = lesson.collection + (lesson.article.sourceLabel ? ' / ' + lesson.article.sourceLabel : '');
    $('catalog-link').hidden = defaults.standalone === true;
    $('official-source').href = safeURL(lesson.article.url);
    $('passage-ref').textContent = `Questions ${start}–${start + total - 1} refer to the following article.`;
    $('source-note').textContent = lesson.exercise.note || '';
    $('questions-title').textContent = `阅读练习 · ${total} 题`;
    $('progress').setAttribute('aria-valuemax', total);
    const reader = $('reader');
    reader.replaceChildren();
    appendArticleBlocks(reader, lesson.article.body);
  }

  function scrollToQuestions() { $('questions-section').scrollIntoView({behavior: 'smooth', block: 'start'}); }
  function locateEvidence(question) {
    const paragraphs = [...$('reader').querySelectorAll('p, li, pre')];
    paragraphs.forEach(p => p.classList.remove('evidence-highlight'));
    const found = paragraphs.find(p => p.textContent.toLowerCase().includes(question.needle.toLowerCase()));
    if (found) { found.classList.add('evidence-highlight'); found.scrollIntoView({behavior: 'smooth', block: 'center'}); announce('已高亮相关原文段落。'); }
    else announce('未匹配到相关段落，请参考解析中的位置说明。');
  }
  function jumpQuestion(i) {
    state.current = i; state.questionsOpen = true; render(); save();
    const target = $('question-' + i);
    if (target) { target.scrollIntoView({behavior: 'smooth', block: 'start'}); target.querySelector('h2').focus({preventScroll: true}); }
  }
  function render() {
    const review = state.mode === 'review';
    const ids = visibleIds();
    if (ids.length && !ids.includes(state.current)) state.current = ids[0];
    document.body.dataset.layout = state.layout;
    document.body.classList.toggle('reviewing', review);
    $('reading-layout').setAttribute('aria-pressed', String(state.layout === 'reading'));
    $('exam-layout').setAttribute('aria-pressed', String(state.layout === 'exam'));
    $('answer-mode').setAttribute('aria-pressed', String(!review));
    $('review-mode').setAttribute('aria-pressed', String(review));
    $('exercise-tools').hidden = !questionsVisible();
    $('questions-section').hidden = !questionsVisible();
    $('actions').hidden = !questionsVisible();
    $('reading-finish').hidden = questionsVisible();
    $('close-questions').hidden = state.layout !== 'reading';
    $('flag-current').disabled = ids.length === 0;
    $('flag-current').setAttribute('aria-pressed', String(state.flags[state.current]));
    $('flag-current').textContent = (state.flags[state.current] ? '取消标记 ' : '标记 ') + (start + state.current);
    $('progress-label').textContent = `已答 ${answerCount()} / ${total}`;
    $('progress-fill').style.width = (answerCount() / total * 100) + '%';
    $('progress').setAttribute('aria-valuenow', answerCount());
    $('result').hidden = !review;
    $('review-controls').hidden = !review;
    $('wrong-only').checked = state.wrongOnly;
    $('filter-count').textContent = state.wrongOnly ? `${ids.length} 题` : '';
    $('submit').hidden = review;
    $('back-answer').hidden = !review;
    $('nav-legend').textContent = review ? '绿色表示正确 · 红色表示错误或未答 · 小圆点表示已标记' : '灰色表示已答 · 小圆点表示已标记 · 边框表示当前题';
    const nav = $('question-nav'); nav.replaceChildren();
    questions.forEach((question, i) => {
      const button = el('button', {type: 'button', 'aria-label': `第 ${start + i} 题，${state.answers[i] === null ? '未答' : '已答'}${state.flags[i] ? '，已标记' : ''}`}, String(start + i));
      button.classList.toggle('answered', state.answers[i] !== null);
      button.classList.toggle('current', state.current === i && ids.includes(i));
      button.classList.toggle('flagged', state.flags[i]);
      if (review) button.classList.add(state.answers[i] === question.answer ? 'correct' : 'incorrect');
      if (state.current === i) button.setAttribute('aria-current', 'step');
      button.disabled = !ids.includes(i);
      button.addEventListener('click', () => jumpQuestion(i)); nav.append(button);
    });
    renderTime();
    if (review) {
      const result = $('result'); result.replaceChildren();
      const top = el('div', {class: 'result-top'});
      top.append(el('span', {class: 'score'}, `${correctCount()} / ${total}`), el('span', {class: 'small'}, `正确率 ${Math.round(correctCount() / total * 100)}%`));
      result.append(top, el('p', {}, `${state.submitted ? '已交卷' : '解答预览'} · 答错 ${answerCount() - correctCount()} 题 · 未答 ${total - answerCount()} 题 · 用时 ${$('timer').textContent}`), el('span', {class: 'small muted'}, '逐题核对依据，理解干扰项。'));
    }
    $('question-container').replaceChildren();
    $('empty-filter').hidden = ids.length > 0;
    if (questionsVisible()) ids.forEach(renderQuestion);
  }

  function renderQuestion(i) {
    const question = questions[i], review = state.mode === 'review';
    const article = el('article', {class: 'question', id: 'question-' + i});
    if (review) article.append(el('div', {class: 'qmeta'}, question.type));
    const stem = el('h2', {class: 'stem', id: 'question-stem-' + i, lang: 'en', tabindex: '-1'});
    stem.append(el('span', {class: 'question-number'}, (start + i) + '. '), document.createTextNode(question.stem));
    article.append(stem);
    const field = el('fieldset', {class: 'options', lang: 'en'});
    field.append(el('legend', {}, 'Choose the best answer.'));
    question.options.forEach((text, j) => {
      const label = el('label', {class: 'option' + (review ? ' review' : '')});
      const radio = el('input', {type: 'radio', name: 'q' + i, value: j, 'aria-label': letters[j] + '. ' + text});
      radio.checked = state.answers[i] === j; radio.disabled = review;
      const body = el('span', {}, text);
      label.append(radio, el('span', {class: 'letter'}, letters[j]), body);
      if (!review && radio.checked) label.classList.add('selected');
      if (review && j === question.answer) { label.classList.add('is-answer'); body.append(el('span', {class: 'answer-label'}, radio.checked ? '正确答案 · 你的选择' : '正确答案')); }
      if (review && radio.checked && j !== question.answer) { label.classList.add('is-wrong'); body.append(el('span', {class: 'answer-label'}, '你的选择 · 错误')); }
      radio.addEventListener('change', () => {
        state.answers[i] = j; state.current = i; state.submitted = false; startTimer(); render(); save();
        document.querySelector(`input[name="q${i}"][value="${j}"]`).focus({preventScroll: true});
        announce(`第 ${start + i} 题已作答，已完成 ${answerCount()} 题。`);
      });
      field.append(label);
    });
    article.append(field);
    if (review) {
      const analysis = el('section', {class: 'analysis', 'aria-label': '答案解析'});
      analysis.append(el('h3', {}, `答案 ${letters[question.answer]} · ${state.answers[i] === null ? '本题未作答' : state.answers[i] === question.answer ? '回答正确' : '需要复习'}`), el('p', {}, question.explain));
      const evidence = el('div', {class: 'evidence'}), row = el('div', {class: 'row'});
      evidence.append(el('strong', {}, '原文依据位置'), el('p', {}, question.where));
      const locate = el('button', {type: 'button', class: 'small'}, '返回原文依据');
      locate.addEventListener('click', () => locateEvidence(question));
      row.append(locate, el('a', {href: safeURL(lesson.article.url), target: '_blank', rel: 'noopener noreferrer', class: 'small'}, '对照官网 ↗'));
      evidence.append(row); analysis.append(evidence, el('h3', {}, '干扰项分析'));
      const list = el('ul'); question.traps.forEach(text => list.append(el('li', {}, text))); analysis.append(list);
      const detail = el('details'); detail.append(el('summary', {}, '解题提示'), el('p', {}, question.tip)); analysis.append(detail);
      if (question.source) analysis.append(el('a', {href: safeURL(question.source), target: '_blank', rel: 'noopener noreferrer', class: 'small'}, '延伸资料 ↗'));
      article.append(analysis);
    }
    $('question-container').append(article);
  }

  function hideAlert() { $('submit-alert').hidden = true; }
  function setLayout(layout) {
    state.layout = layout;
    if (!questionsVisible()) stopTimer();
    hideAlert(); render(); save(); announce('已切换到' + (layout === 'reading' ? '阅读版' : '考卷版') + '，答题进度已保留。');
  }
  function setMode(mode, submitted = false) {
    if (mode === 'review') stopTimer();
    state.mode = mode; state.questionsOpen = true;
    if (submitted) state.submitted = true;
    if (mode === 'answer') state.wrongOnly = false;
    hideAlert(); render(); save();
    announce(mode === 'review' ? '已显示答案与解析。' : '已进入答题阶段，答案与解析已隐藏。');
  }
  $('reading-layout').addEventListener('click', () => setLayout('reading'));
  $('exam-layout').addEventListener('click', () => setLayout('exam'));
  $('answer-mode').addEventListener('click', () => { setMode('answer'); scrollToQuestions(); });
  $('review-mode').addEventListener('click', () => setMode('review'));
  $('back-answer').addEventListener('click', () => setMode('answer'));
  $('open-questions').addEventListener('click', () => { state.questionsOpen = true; render(); save(); scrollToQuestions(); });
  $('close-questions').addEventListener('click', () => {
    stopTimer(); state.questionsOpen = false; state.mode = 'answer'; state.wrongOnly = false; hideAlert(); render(); save();
    $('article').scrollIntoView({behavior: 'smooth', block: 'start'});
  });
  $('flag-current').addEventListener('click', () => { state.flags[state.current] = !state.flags[state.current]; render(); save(); });
  $('submit').addEventListener('click', () => {
    const missing = questions.map((_, i) => i).filter(i => state.answers[i] === null);
    if (missing.length) { $('submit-alert-text').textContent = `还有 ${missing.length} 题未答（${missing.map(i => start + i).join('、')}）。未答题按未得分处理。`; $('submit-alert').hidden = false; $('submit-alert').scrollIntoView({behavior: 'smooth', block: 'center'}); }
    else { setMode('review', true); $('result').scrollIntoView({behavior: 'smooth', block: 'center'}); }
  });
  $('go-unanswered').addEventListener('click', () => { const first = state.answers.findIndex(x => x === null); hideAlert(); if (first >= 0) jumpQuestion(first); });
  $('submit-anyway').addEventListener('click', () => { setMode('review', true); $('result').scrollIntoView({behavior: 'smooth', block: 'center'}); });
  $('wrong-only').addEventListener('change', event => { state.wrongOnly = event.target.checked; render(); save(); });
  $('show-all').addEventListener('click', () => { state.wrongOnly = false; render(); save(); });
  $('timer-toggle').addEventListener('click', () => { running ? stopTimer() : startTimer(); renderTime(); });
  $('restart').addEventListener('click', () => $('reset-dialog').showModal());
  $('cancel-reset').addEventListener('click', () => $('reset-dialog').close());
  $('confirm-reset').addEventListener('click', () => {
    running = false; const layout = state.layout; state = fresh(); state.layout = layout; $('reset-dialog').close();
    hideAlert(); render(); save(); announce('新一轮练习已开始，当前版式已保留。');
  });
  $('print-paper').addEventListener('click', () => window.print());
  $('download-paper').addEventListener('click', () => {
    const doc = new DOMParser().parseFromString(document.documentElement.outerHTML, 'text/html');
    doc.getElementById('export-defaults').textContent = JSON.stringify({layout: state.layout, standalone: true});
    for (const id of ['question-container', 'result', 'question-nav', 'live']) doc.getElementById(id).replaceChildren();
    for (const node of doc.querySelectorAll('.evidence-highlight')) node.classList.remove('evidence-highlight');
    doc.getElementById('reset-dialog').removeAttribute('open');
    const blob = new Blob(['<!doctype html>\n' + doc.documentElement.outerHTML], {type: 'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob), anchor = document.createElement('a');
    anchor.href = url; anchor.download = lesson.id + '-' + state.layout + '.html'; anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    announce('已导出单一 HTML，包含完整原文、题目、两种版式和解析。');
  });
  document.addEventListener('visibilitychange', () => { syncTime(); save(); });
  window.addEventListener('pagehide', () => { syncTime(); save(); });
  setInterval(() => { renderTime(); if (running) { syncTime(); save(); } }, 1000);
  renderArticle(); render(); save();
})();
</script>
</body>
</html>
